[project]
name = "agentic-ai-fdp"
version = "1.0.0"
description = "Hands-on Agentic AI workshop — Amrita School of AI, Coimbatore"
readme = "README.md"
requires-python = ">=3.10"

# Pinned with lower bounds only, and a lock file alongside. The lock is what
# participants actually install from, so a release upstream on the morning of
# the workshop cannot change what happens in the room.
# Upper bounds are on purpose. LangChain 1.x renamed and moved enough that
# material written against it does not run on 0.3.x, and a 2.x release would do
# the same again. These are the versions the exercises were written and tested
# against.
dependencies = [
    "langchain>=1.3.14,<2",
    "langchain-core>=1.5.3,<2",
    "langchain-openai>=1.4.2,<2",
    "langchain-community>=0.4.2,<1",
    "langchain-text-splitters>=1.1.2,<2",
    "langgraph>=1.2.10,<2",
    "faiss-cpu>=1.15.0",
    "pypdf>=6.1.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_fdp"]

[tool.pytest.ini_options]
testpaths = ["exercises"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
